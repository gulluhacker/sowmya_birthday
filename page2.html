
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080406"
    >

    <title>A Little Something For You ♡</title>

    <!-- Common CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =========================================
     PAGE 2 — BIRTHDAY REVEAL
========================================= -->

<section class="page">


    <!-- Background Glow -->

    <div class="glow"></div>


    <!-- Floating Particles -->

    <div class="particles">

        <span
            class="particle"
            style="left:8%; top:20%;"
        ></span>

        <span
            class="particle"
            style="left:20%; top:70%; animation-delay:1s;"
        ></span>

        <span
            class="particle"
            style="left:45%; top:12%; animation-delay:2s;"
        ></span>

        <span
            class="particle"
            style="left:78%; top:25%; animation-delay:1.5s;"
        ></span>

        <span
            class="particle"
            style="left:90%; top:68%; animation-delay:3s;"
        ></span>

        <span
            class="particle"
            style="left:60%; top:82%; animation-delay:2.5s;"
        ></span>

    </div>


    <!-- Main Content -->

    <main class="content">


        <!-- Section Label -->

        <div class="label reveal">

            01 — TODAY IS YOUR DAY

        </div>


        <!-- Heading -->

        <h1
            class="title reveal"
            style="margin-top:30px;"
        >

            A Very Special Day

        </h1>


        <!-- Name -->

        <div
            class="script-name reveal"
            style="margin-top:20px;"
        >

            Sowmya

        </div>


        <!-- Divider -->

        <div class="divider"></div>


        <!-- Message -->

        <p
            class="subtitle reveal"
        >

            Today isn't just another day.

            <br><br>

            It's a day to celebrate

            <span
                style="color:#f3a88e;"
            >
                you
            </span>

            —
            your smile,
            your happiness,
            and all the beautiful moments
            waiting for you.

        </p>


        <!-- Button -->

        <a
            href="page3.html"
            class="btn reveal"
        >

            A Little Message

            <span style="margin-left:10px;">
                💌
            </span>

        </a>


    </main>


</section>


<!-- JavaScript -->

<script src="script.js"></script>


</body>

</html>
