<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happiest Birthday Sowmya ❤️</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="background">

        <div class="glow"></div>

        <div class="particles">
            <span class="particle p1"></span>
            <span class="particle p2"></span>
            <span class="particle p3"></span>
            <span class="particle p4"></span>
            <span class="particle p5"></span>
            <span class="particle p6"></span>
        </div>

    </div>


    <!-- PAGE 1 -->

    <main class="page">

        <section class="hero">

            <div class="label">
                A LITTLE SOMETHING FOR YOU
            </div>


            <h1 class="title">
                Happiest Birthday
            </h1>


            <div class="name">
                Sowmya
            </div>


            <div class="divider"></div>


            <p class="subtitle">

                Today isn't just another day...

                <br>

                It's a day to celebrate

                <br>

                <span>
                    someone very special. ❤️
                </span>

            </p>


            <!-- Music -->

            <audio
                id="birthdayMusic"
                preload="auto"
            >

                <source
                    src="a-thousand-years.mp3"
                    type="audio/mpeg"
                >

            </audio>


            <!-- START BUTTON -->

            <a
                href="page2.html"
                id="startCelebration"
                class="btn"
            >

                Begin The Celebration

                <span class="btn-icon">
                    ✨
                </span>

            </a>


            <p class="small-note">
                A little journey made just for you
            </p>

        </section>

    </main>


    <!-- Music + Navigation -->

    <script>

        const startButton =
            document.getElementById("startCelebration");

        const birthdayMusic =
            document.getElementById("birthdayMusic");


        startButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                birthdayMusic.volume = 0.45;

                birthdayMusic.play()
                    .then(function () {

                        /*
                         * Give the browser a moment
                         * to start the music.
                         */

                        setTimeout(function () {

                            window.location.href =
                                "page2.html";

                        }, 800);

                    })

                    .catch(function (error) {

                        console.log(
                            "Audio could not start:",
                            error
                        );

                        /*
                         * Even if audio fails,
                         * Page 2 must still open.
                         */

                        window.location.href =
                            "page2.html";

                    });

            });

    </script>

</body>

</html>
