<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080406"
    >

    <title>
        For Sowmya ♡
    </title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =========================================
     PAGE 1 — OPENING
========================================= -->

<section class="page">


    <!-- Background Glow -->

    <div class="glow"></div>


    <!-- Floating Particles -->

    <div class="particles">

        <span
            class="particle"
            style="left:8%; top:18%;"
        ></span>

        <span
            class="particle"
            style="left:18%; top:72%; animation-delay:1s;"
        ></span>

        <span
            class="particle"
            style="left:42%; top:12%; animation-delay:2s;"
        ></span>

        <span
            class="particle"
            style="left:72%; top:25%; animation-delay:1.5s;"
        ></span>

        <span
            class="particle"
            style="left:91%; top:65%; animation-delay:3s;"
        ></span>

        <span
            class="particle"
            style="left:58%; top:82%; animation-delay:2.5s;"
        ></span>

    </div>


    <!-- Main Content -->

    <main class="content">


        <!-- Small Introduction -->

        <div class="label reveal">

            FOR SOMEONE SPECIAL

        </div>


        <!-- Name -->

        <div
            class="script-name reveal"
            style="margin-top:25px;"
        >

            Sowmya

        </div>


        <!-- Divider -->

        <div class="divider"></div>


        <!-- Birthday Heading -->

        <h1
            class="title reveal"
        >

            Happiest Birthday,

            <br>

            <span
                style="color:#ffd3c1;"
            >
                My Dear Sister
            </span>

        </h1>


        <!-- Subtitle -->

        <p
            class="subtitle reveal"
        >

            A little celebration made
            <br>
            especially for you ♡

        </p>


        <!-- Start Button -->

        <button
            class="btn reveal"
            onclick="goToPage('page2.html')"
        >

            Begin The Celebration

            <span
                style="margin-left:10px;"
            >
                ✨
            </span>

        </button>


    </main>


</section>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="script.js"></script>


</body>

</html>
