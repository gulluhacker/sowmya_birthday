<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For Sowmya ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="page">

        <!-- Background glow -->
        <div class="glow"></div>

        <!-- Floating particles -->
        <div class="particles">

            <span
                class="particle"
                style="left:10%; top:20%;"
            ></span>

            <span
                class="particle"
                style="left:25%; top:75%; animation-delay:1s;"
            ></span>

            <span
                class="particle"
                style="left:48%; top:12%; animation-delay:2s;"
            ></span>

            <span
                class="particle"
                style="left:75%; top:25%; animation-delay:1.5s;"
            ></span>

            <span
                class="particle"
                style="left:90%; top:70%; animation-delay:3s;"
            ></span>

        </div>


        <!-- Main content -->

        <main class="content">

            <div class="label">
                A LITTLE SOMETHING FOR YOU
            </div>


            <h1
                class="title"
                style="margin-top:30px;"
            >
                Happiest Birthday
            </h1>


            <div
                class="script-name"
                style="margin-top:15px;"
            >
                Sowmya
            </div>


            <div class="divider"></div>


            <p class="subtitle">

                Today isn't just another day...

                <br>

                It's a day to celebrate

                <br>

                someone very special. ❤️

            </p>


            <!-- DIRECT PAGE 2 LINK -->

            <a
                href="page2.html"
                class="btn"
                style="margin-top:40px;"
            >
                Begin The Celebration

                <span style="margin-left:10px;">
                    ✨
                </span>
            </a>


            <p
                style="
                    margin-top:18px;
                    font-size:11px;
                    letter-spacing:2px;
                    color:rgba(235,215,208,0.45);
                "
            >
                A little journey made just for you
            </p>

        </main>

    </section>

</body>

</html>
