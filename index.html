<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080406"
    >

    <title>Happy Birthday Sowmya ♡</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<section class="page">


    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="glow"></div>


    <!-- =====================================
         FLOATING PARTICLES
    ====================================== -->

    <div class="particles">

        <span
            class="particle"
            style="left:8%; top:18%;"
        ></span>

        <span
            class="particle"
            style="left:20%; top:75%; animation-delay:1s;"
        ></span>

        <span
            class="particle"
            style="left:45%; top:10%; animation-delay:2s;"
        ></span>

        <span
            class="particle"
            style="left:78%; top:25%; animation-delay:1.5s;"
        ></span>

        <span
            class="particle"
            style="left:91%; top:70%; animation-delay:3s;"
        ></span>

    </div>


    <!-- =====================================
         MAIN CONTENT
    ====================================== -->

    <main class="content">


        <!-- Small Label -->

        <div class="label reveal">

            A LITTLE SOMETHING FOR YOU

        </div>


        <!-- Main Heading -->

        <h1
            class="title reveal"
            style="margin-top:30px;"
        >

            Happiest Birthday

        </h1>


        <!-- Name -->

        <div
            class="script-name reveal"
            style="margin-top:15px;"
        >

            Sowmya

        </div>


        <!-- Divider -->

        <div class="divider"></div>


        <!-- Intro -->

        <p
            class="subtitle reveal"
            style="
                max-width:650px;
                margin-left:auto;
                margin-right:auto;
            "
        >

            Today isn't just another day...

            <br>

            It's a day to celebrate

            <br>

            <span style="color:#f3a88e;">
                someone very special. ❤️
            </span>

        </p>


        <!-- =====================================
             START BUTTON
        ====================================== -->

        <a
            href="./page2.html"
            class="btn reveal"
            style="margin-top:40px;"
        >

            Begin The Celebration

            <span style="margin-left:10px;">
                ✨
            </span>

        </a>


        <!-- Small text -->

        <p
            class="reveal"
            style="
                margin-top:18px;
                font-size:11px;
                letter-spacing:2px;
                color:rgba(235,215,208,0.45);
            "
        >

            A little journey made just for you

        </p>


    </main>


</section>


<!-- =====================================
     JAVASCRIPT
====================================== -->

<script src="script.js"></script>


</body>

</html>
