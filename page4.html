<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta

<section class="page">

    <main class="content">


        <div class="label reveal">
            03 — LITTLE MOMENTS
        </div>


        <h1

        >
            Our Memories

        <p class="subtitle reveal">

        ================================= -->

        <div class="memory-grid">


            <!-- PHOTO 1 -->

            <div class="memory-card photo-memory reveal">

                <img

                    <span>01</span>

                    <p>

                    </p>

            <!-- PHOTO 2 -->

            <div class="memory-card photo-memory reveal">

                    </p>

                </div>

            </div>

            <div class="memory-card photo-memory reveal">

                <img
                    src="sowmya3.jpg"

                <div class="photo-overlay">

                    <span>03</span>

                    <p>
                        A moment to remember ♡
                    </p>

                </div>

            </div>


            <!-- FOURTH CARD -->

            <div class="memory-card memory-last reveal">

                <div class="last-memory-content">

                    <div class="last-heart">

                    </h3>

                    <p>

                        More memories to come...

                    <span>
                        ♡

        <!-- NEXT BUTTON -->

        <a
