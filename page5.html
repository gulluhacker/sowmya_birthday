<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080406"
    >

    <title>Make A Wish 🎂</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<section class="page">

    <div class="glow"></div>

    <div class="particles">

        <span class="particle" style="left:8%;top:18%;"></span>

        <span
            class="particle"
            style="left:20%;top:75%;animation-delay:1s;"
        ></span>

        <span
            class="particle"
            style="left:45%;top:10%;animation-delay:2s;"
        ></span>

        <span
            class="particle"
            style="left:78%;top:25%;animation-delay:1.5s;"
        ></span>

        <span
            class="particle"
            style="left:91%;top:70%;animation-delay:3s;"
        ></span>

    </div>


    <main class="content">


        <div class="label reveal">
            04 — MAKE A WISH
        </div>


        <h1
            class="title reveal"
            style="margin-top:25px;"
        >
            Make A Wish
        </h1>


        <p class="subtitle reveal">

            Close your eyes...

            <br>

            Think of something beautiful.

            <br>

            And make your wish. ✨

        </p>


        <!-- CAKE -->

        <div
            class="cake reveal"
            id="birthdayCake"
        >

            <div
                class="candle"
                id="candle1"
            >
                <div class="flame"></div>
            </div>


            <div
                class="candle"
                id="candle2"
            >
                <div class="flame"></div>
            </div>


            <div
                class="candle"
                id="candle3"
            >
                <div class="flame"></div>
            </div>


            <div class="cake-top"></div>

            <div class="cream"></div>

            <div class="cake-body"></div>

        </div>


        <!-- BLOW BUTTON -->

        <button
            class="btn reveal"
            id="blowButton"
            onclick="makeWish()"
        >

            Blow The Candles

            <span style="margin-left:10px;">
                🕯️
            </span>

        </button>


        <!-- WISH MESSAGE -->

        <div
            id="wishMessage"
            class="wish-message"
        ></div>


        <!-- FINAL BUTTON -->

        <a
            href="./page6.html"
            class="btn"
            id="finalButton"
            style="
                display:none;
                margin-top:20px;
            "
        >

            Your Final Surprise

            <span style="margin-left:10px;">
                🎆
            </span>

        </a>


    </main>

</section>


<script src="script.js"></script>


<script>

function makeWish() {

    const candles =
        document.querySelectorAll(".candle");

    const button =
        document.getElementById("blowButton");

    const message =
        document.getElementById("wishMessage");

    const finalButton =
        document.getElementById("finalButton");


    /* Turn off candles */

    candles.forEach(function(candle) {

        candle.classList.add("off");

    });


    /* Show message */

    message.innerHTML =
        "Wish made... ✨❤️";


    /* Disable button */

    button.disabled = true;

    button.style.opacity = "0.5";

    button.innerHTML =
        "Wish Made ✨";


    /* Show final button */

    setTimeout(function() {

        finalButton.style.display =
            "inline-flex";

    }, 1000);

}

</script>


</body>

</html>
